name: Deploy

on:
  push:
    branches: [main]
  # auto-merge.yml dispatches this after it merges: a merge made with the
  # workflow's GITHUB_TOKEN does not fire `push` workflows, by GitHub's design.
  workflow_dispatch:

# Never run two production deploys at once, and never cancel one mid-flight: a
# cancelled migration is the worst available outcome.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ci.yml and deploy.yml both fire on push to main and do not wait for each
  # other. Without this job, a red build would still deploy.
  gate:
    name: Gate (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test

  migrate:
    name: Apply D1 migrations
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Migrations run BEFORE the new code deploys. Safe because migrations are
      # append-only (enforced in ci.yml): the running Worker never sees a
      # column disappear underneath it.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 migrations apply tagalong-db --config apps/api/wrangler.jsonc --remote

  deploy-api:
    name: Deploy API Worker
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          # --var GIT_SHA is what /health serves; --tag is what the smoke job
          # reads back from the Cloudflare API.
          command: deploy --tag ${{ github.sha }} --var GIT_SHA:${{ github.sha }}
          # App secrets are NOT passed here. They are set once with
          # `wrangler secret put` and persist across deploys.

  # After the API, so the new web app never calls an API that lacks its routes.
  deploy-web:
    name: Deploy web app
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@tagalong/web

      - name: No secrets in the bundle
        run: bash scripts/check-bundle-secrets.sh apps/web/dist

      # Assets-only Worker on the tagalong.averrow.com Custom Domain. No
      # bindings, no secrets: --tag is how the smoke job confirms the version.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy --tag ${{ github.sha }}

  smoke:
    name: Smoke test
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: API Worker is serving this commit
        run: bash scripts/deployed-version.sh tagalong-api "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Web Worker is serving this commit
        if: ${{ !cancelled() }}
        run: bash scripts/deployed-version.sh tagalong-web "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Not cancelled-gated on the step above: a wrong live version and a
      # failing /health are different problems, and both should be reported.
      - name: API health
        if: ${{ !cancelled() }}
        run: bash scripts/health-check.sh https://tagalong-api.averrow.com
