packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts by default. These genuinely need a
# postinstall (native binary download/build).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@cloudflare/workerd-linux-64"

# Single-source dependency versions across every workspace.
catalog:
  "@cloudflare/vitest-plugin": ^1.1.8
  "@types/node": ^22.20.2
  hono: ^4.13.7
  prettier: ^3.9.6
  typescript: ^5.9.3
  # @cloudflare/vitest-plugin peers on vitest ^4.1.0. Bump both together or not at all.
  vitest: ^4.1.11
  wrangler: ^4.131.1
  zod: ^4.6.7
  "@anthropic-ai/sdk": ^1.6.0
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.6
  "@vitejs/plugin-react": ^6.2.1
