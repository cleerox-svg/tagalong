packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts by default. These genuinely need a
# postinstall (native binary download/build).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@cloudflare/workerd-linux-64"

# Single-source dependency versions across every workspace.
catalog:
  "@cloudflare/vitest-plugin": ^1.1.8
  "@types/node": ^22.20.2
  hono: ^4.13.7
  prettier: ^3.9.6
  typescript: ^5.9.3
  # @cloudflare/vitest-plugin peers on vitest ^4.1.0. Bump both together or not at all.
  vitest: ^4.1.11
  wrangler: ^4.131.1
  zod: ^4.6.7
  "@anthropic-ai/sdk": ^1.6.0
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.6
  "@vitejs/plugin-react": ^6.2.1
  # Capacitor (phase 6). Core, CLI and the native platforms share one major and
  # must move together; plugins peer on @capacitor/core >=8.
  "@capacitor/core": ^8.6.0
  "@capacitor/cli": ^8.6.0
  "@capacitor/ios": ^8.6.0
  "@capacitor/android": ^8.6.0
  "@capacitor/app": ^8.1.2
  "@capacitor/browser": ^8.0.5
  # firebase (web SDK) is an optional peer and deliberately not installed: push
  # uses the native SDKs only, so nothing Firebase lands in the PWA bundle.
  "@capacitor-firebase/messaging": ^8.6.0
  # Keychain (iOS) / Keystore (Android) backed. Not @capacitor/preferences.
  capacitor-secure-storage-plugin: ^0.13.0
